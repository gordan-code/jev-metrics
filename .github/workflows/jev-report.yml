name: jev-report

# Generates the Jev Metrics calibration/trend report from committed evaluation
# and outcome JSON files.
#
# Triggers:
#   - manually (workflow_dispatch)
#   - on a push to the repository's default branch
#   - on a `/jev-report` comment on a PR or issue
#
# Expected input layout (defaults, configurable via action inputs / env):
#   evals/*.json            evaluation snapshots (bare Eval / wrapper / MCP resp.)
#   evals/outcomes/*.json   after-the-fact outcome markers
#
# Note: reports surface real regressions only when you record *outcomes* after
# your changes reach the field / a staging gate.

on:
  workflow_dispatch:
  push:
    # Both names are listed because a repo created with `git init` defaults to
    # `master` while GitHub's UI-created repos default to `main`. Matching the
    # actual default branch is required or push runs never fire.
    branches: [main, master]
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write # to post the report as a PR comment on /jev-report

jobs:
  report:
    runs-on: ubuntu-latest
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'push' ||
      (github.event_name == 'issue_comment' && startsWith(github.event.comment.body, '/jev-report'))
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Install + build
        run: |
          npm ci --cache .npm-cache-ci --ignore-scripts
          npm run build

      - name: Generate report
        env:
          JEV_METRICS_EVALS_DIR: evals
          JEV_METRICS_OUTCOMES_DIR: evals/outcomes
        run: node scripts/action.mjs > report.md

      # Surface the report directly in the Actions run UI.
      - name: Job summary
        run: cat report.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload report artifact
        uses: actions/upload-artifact@v4
        with:
          name: jev-metrics-report
          path: report.md

      # A push event has no issue/PR number, so commenting is only valid for
      # the `/jev-report` comment trigger.
      - name: Post report as comment (/jev-report)
        if: github.event_name == 'issue_comment'
        uses: peter-evans/create-or-update-comment@v4
        with:
          issue-number: ${{ github.event.issue.number }}
          body-file: report.md
          edit-mode: replace